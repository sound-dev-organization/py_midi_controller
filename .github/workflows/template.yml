name: Tox-based job template

on:
  workflow_call:
    inputs:
      tox_env:
        required: true
        type: string

jobs:
  run_tox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip tox
      - name: Run tox
        run: tox -e ${{ inputs.tox_env }}
